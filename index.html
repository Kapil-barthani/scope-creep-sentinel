<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Scope-Creep Sentinel & CR Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body {
      background-color: #090d16;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PRESET_SOW = `Core Deliverables & Specifications:
1. User Authentication: Standard Email & Password with JWT session tokens.
2. Product Catalog: Grid view, category filtering, search by title.
3. Shopping Cart: In-memory/session storage, quantity adjustment.
4. Payment Processing: Standard Stripe Checkout (US Credit/Debit cards).
5. Deployment: Basic AWS EC2 staging environment.

Timeline: 8 Weeks
Fixed Project Fee: 15,000 PKR.`;

    const PRESET_CREEP = `Hi Team,

Great progress on the sprint demo! Before we launch next Tuesday, we need to make a few quick additions:

1. Let's add Apple Sign-In and Google One-Tap login for faster mobile checkout.
2. We need customer product reviews with 5-star ratings and photo uploads.
3. Our European partners requested payment support for Bitcoin and Ethereum (USDT is also acceptable).
4. Can you also build an automated recurring subscription billing engine?

Please confirm these are included in the upcoming release.`;

    const SAMPLE_ANALYSIS = {
      has_scope_creep: true,
      total_drift_days: 14.5,
      total_extra_cost: 11600.0,
      currency_symbol: "$",
      features: [
        {
          feature_name: "Apple Sign-In & Google One-Tap Login",
          status: "PARTIAL_EXTENSION",
          sow_clause_citation: "Deliverable 1: User Authentication (Standard Email & Password with JWT)",
          reasoning: "Baseline SOW specifies standard email/password authentication only. OAuth2/Social SSO and mobile One-Tap require additional third-party developer accounts, SDK integration, and backend token verification flows.",
          estimated_dev_days: 2.5,
          estimated_cost: 2000.0,
          complexity: "Medium"
        },
        {
          feature_name: "Product Reviews, 5-Star Ratings & Photo Uploads",
          status: "OUT_OF_SCOPE",
          sow_clause_citation: "Deliverable 2: Product Catalog (Grid view, category filtering, search by title)",
          reasoning: "Review submission, rating aggregations, media upload validation, S3 storage integration, and moderation mechanics are entirely absent from the baseline catalog deliverables.",
          estimated_dev_days: 4.0,
          estimated_cost: 3200.0,
          complexity: "Medium"
        },
        {
          feature_name: "Cryptocurrency Payments (Bitcoin, Ethereum, USDT)",
          status: "OUT_OF_SCOPE",
          sow_clause_citation: "Deliverable 4: Payment Processing (Standard Stripe Checkout for US Credit/Debit cards)",
          reasoning: "The contract strictly covers fiat Stripe Checkout. Crypto gateways (BitPay, Coinbase Commerce or direct Web3 RPC nodes) require alternate settlement, webhook listeners, confirmation latency handling, and compliance adjustments.",
          estimated_dev_days: 4.5,
          estimated_cost: 3600.0,
          complexity: "High"
        },
        {
          feature_name: "Automated Recurring Subscription Engine",
          status: "OUT_OF_SCOPE",
          sow_clause_citation: "Not mentioned in baseline SOW (Deliverable 3: standard shopping cart checkout)",
          reasoning: "One-time transactional checkout does not include recurring billing cron schedulers, proration, invoice generation, dunning management, and customer portal subscription modifications.",
          estimated_dev_days: 3.5,
          estimated_cost: 2800.0,
          complexity: "High"
        }
      ],
      client_response_subject: "Scope Assessment & Milestone Update - SaaS Commerce Portal",
      client_response_body: `Dear Client,

Thank you for sharing these feature suggestions for the SaaS Commerce Portal. The engineering team has evaluated them against our current signed Statement of Work.

While our scheduled launch for next Tuesday remains on track for the committed baseline scope (Email/Password Auth, Catalog, Cart, and Stripe Checkout), several items in your message represent new architectural capabilities:

• Apple Sign-In & Google One-Tap: Extension of Auth (+2.5 days)
• Product Reviews & Photo Uploads: New Feature (+4.0 days)
• Crypto Payment Processing: New Integration (+4.5 days)
• Recurring Subscription Engine: New Architecture (+3.5 days)

In total, these additions constitute 14.5 engineering days ($11,600). To avoid delaying your scheduled release date, we recommend launching with the agreed Phase 1 baseline on Tuesday, and delivering these enhancements immediately thereafter under Change Order #1.

Please find the attached Change Order proposal. Let us know if you would like us to proceed!

Best regards,
Solutions Architecture Team`,
      change_order_markdown: `# COMMERCIAL CHANGE ORDER #001

**Project:** SaaS Commerce Portal  
**Status:** Pending Approval  
**Date:** September 9, 2026  

---

### 1. Overview of Requested Scope Additions

The following items requested represent extensions beyond the baseline Statement of Work:

| Item | Scope Assessment | Dev Days | Est. Cost |
| :--- | :--- | :---: | :---: |
| Apple Sign-In & Google One-Tap | PARTIAL_EXTENSION | 2.5 days | $2,000 |
| Reviews, 5-Star Ratings & Photo Uploads | OUT_OF_SCOPE | 4.0 days | $3,200 |
| Cryptocurrency Gateways (BTC/ETH/USDT) | OUT_OF_SCOPE | 4.5 days | $3,600 |
| Recurring Subscription Billing Engine | OUT_OF_SCOPE | 3.5 days | $2,800 |
| **TOTAL REVISED COMMITMENT** | **SCOPE DRIFT** | **14.5 days** | **$11,600** |

---

### 2. Commercial Terms
- **Payment Terms:** 50% upon Change Order execution, 50% upon staging acceptance.
- **Baseline SOW Impact:** Baseline deliverables launch on committed milestone schedule.

---

### Signatures

**Client Authorized Representative:** _________________________  
**Date:** _______________  

**Agency Lead:** _________________________  
**Date:** _______________`
    };

    function App() {
      // Configuration & Inputs
      const [sow, setSow] = useState(PRESET_SOW);
      const [email, setEmail] = useState(PRESET_CREEP);
      const [projectName, setProjectName] = useState("SaaS Commerce Portal");
      const [dailyRate, setDailyRate] = useState(800);
      const [currency, setCurrency] = useState("$");
      const [tone, setTone] = useState("diplomatic");

      // Backend API & Settings States
      const [backendUrl, setBackendUrl] = useState(() => localStorage.getItem("sentinel_backend_url") || "");
      const [showSettings, setShowSettings] = useState(false);
      const [tempUrl, setTempUrl] = useState(backendUrl);
      const [connectionStatus, setConnectionStatus] = useState(null); // null | "testing" | "ok" | "fail"

      // UI States
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [analysis, setAnalysis] = useState(null);
      const [activeTab, setActiveTab] = useState("breakdown"); // "breakdown" | "email" | "change_order"
      const [copyToast, setCopyToast] = useState(false);
      const [expandedRow, setExpandedRow] = useState(null);

      // Currency handler for USD and PKR only
      const handleCurrencyChange = (newCurr) => {
        setCurrency(newCurr);
        if (newCurr === "Rs" && dailyRate === 800) {
          setDailyRate(150000);
        } else if (newCurr === "$" && dailyRate === 150000) {
          setDailyRate(800);
        }
      };

      // Dismiss error
      const dismissError = () => setError(null);

      // Load instant sample demo
      const loadDemoAudit = () => {
        setLoading(true);
        setError(null);
        setTimeout(() => {
          setAnalysis(SAMPLE_ANALYSIS);
          setActiveTab("breakdown");
          setLoading(false);
        }, 350);
      };

      // Determine active endpoint
      const getActiveEndpoint = () => {
        if (backendUrl.trim()) {
          return backendUrl.trim().replace(/\/+$/, "") + "/api/analyze";
        }
        if (window.location.protocol.startsWith("http") && (window.location.port === "8000" || window.location.host.includes("8000"))) {
          return "/api/analyze";
        }
        return "http://localhost:8000/api/analyze";
      };

      // Test backend connection
      const testConnection = async (url) => {
        setConnectionStatus("testing");
        const target = (url || backendUrl || "http://localhost:8000").trim().replace(/\/+$/, "");
        try {
          const res = await fetch(`${target}/health`, { signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined });
          if (res.ok) {
            setConnectionStatus("ok");
          } else {
            setConnectionStatus("fail");
          }
        } catch (e) {
          setConnectionStatus("fail");
        }
      };

      const runAudit = async () => {
        setLoading(true);
        setError(null);

        try {
          const endpoint = getActiveEndpoint();
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sow_text: sow,
              email_text: email,
              project_name: projectName,
              daily_rate: parseFloat(dailyRate) || 800,
              currency_symbol: currency,
              tone: tone
            })
          });

          const data = await res.json();

          // Resilient HTTP error interceptor
          if (!res.ok) {
            const detailMsg = data.detail || `Server returned error status ${res.status}`;
            throw new Error(detailMsg);
          }

          setAnalysis(data);
          setActiveTab("breakdown");
        } catch (err) {
          console.error("Scope Audit Error:", err);
          setError(err.message || "Unable to reach FastAPI backend. Please check if backend is running on port 8000, or click API Settings to configure your backend URL.");
        } finally {
          setLoading(false);
        }
      };

      const copyEmail = () => {
        if (!analysis || !analysis.client_response_body) return;
        const text = `Subject: ${analysis.client_response_subject}\n\n${analysis.client_response_body}`;
        navigator.clipboard.writeText(text);
        setCopyToast(true);
        setTimeout(() => setCopyToast(false), 2500);
      };

      const downloadChangeOrder = () => {
        if (!analysis || !analysis.change_order_markdown) return;
        const blob = new Blob([analysis.change_order_markdown], { type: "text/markdown" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Change_Order_${projectName.replace(/\s+/g, "_")}.md`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const getStatusBadge = (status) => {
        switch (status) {
          case "IN_SCOPE":
            return <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-950/70 border border-emerald-500/40 text-emerald-300">IN SCOPE</span>;
          case "OUT_OF_SCOPE":
            return <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-rose-950/70 border border-rose-500/40 text-rose-300">OUT OF SCOPE</span>;
          case "PARTIAL_EXTENSION":
            return <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-amber-950/70 border border-amber-500/40 text-amber-300">PARTIAL EXTENSION</span>;
          case "NEEDS_CLARIFICATION":
            return <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-sky-950/70 border border-sky-500/40 text-sky-300">NEEDS CLARIFICATION</span>;
          default:
            return <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-slate-800 text-slate-300">{status}</span>;
        }
      };

      return (
        <div className="max-w-7xl mx-auto space-y-6">
          {/* Header */}
          <header className="glass-card p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-xl">
            <div className="flex items-center space-x-3">
              <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                ⚡
              </div>
              <div>
                <h1 className="text-xl font-bold text-white tracking-tight flex items-center gap-2">
                  AI Scope-Creep Sentinel 
                </h1>
                <p className="text-xs text-slate-400">Software Agency Profitability & Commercial Change Order Engine</p>
              </div>
            </div>
            
            <div className="flex items-center gap-2.5">
              <button
                onClick={() => {
                  setTempUrl(backendUrl);
                  setShowSettings(true);
                }}
                className="text-xs text-slate-300 hover:text-white bg-slate-900/90 hover:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700/80 flex items-center gap-1.5 transition-all shadow-sm"
                title="Configure Backend API URL"
              >
                <span>⚙️</span>
                <span>API Settings</span>
                {backendUrl ? (
                  <span className="h-1.5 w-1.5 rounded-full bg-indigo-400" title="Custom endpoint configured"></span>
                ) : null}
              </button>
              <span className="text-xs text-slate-400 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-800 flex items-center gap-2">
                <span className="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span> Gemini 3.6 Flash
              </span>
            </div>
          </header>

          {/* Error Banner */}
          {error && (
            <div className="p-4 rounded-xl bg-rose-950/80 border border-rose-500/60 text-rose-200 text-xs flex flex-col md:flex-row justify-between items-start md:items-center gap-3 shadow-lg animate-fadeIn">
              <div className="flex items-start md:items-center space-x-2">
                <span className="text-rose-400 text-base">⚠️</span>
                <div>
                  <div><strong className="font-semibold text-white">Backend Offline or Unreachable:</strong> {error}</div>
                  <div className="text-[11px] text-rose-300/80 mt-0.5">
                    Viewing on GitHub Pages? You can test the full UI using the <strong>Instant Demo</strong>, or configure a live backend in <strong>API Settings</strong>.
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button 
                  onClick={loadDemoAudit} 
                  className="text-white px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 rounded border border-indigo-400/50 text-xs font-semibold shadow"
                >
                  ⚡ Load Demo Audit
                </button>
                <button 
                  onClick={() => {
                    setTempUrl(backendUrl);
                    setShowSettings(true);
                  }} 
                  className="text-slate-200 hover:text-white px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-700 text-xs font-medium"
                >
                  ⚙️ Settings
                </button>
                <button onClick={dismissError} className="text-rose-300 hover:text-white px-2 py-1 bg-rose-900/40 rounded border border-rose-700/50 text-xs">
                  Dismiss
                </button>
              </div>
            </div>
          )}

          {/* Main Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Left Inputs Column (5 cols) */}
            <div className="lg:col-span-5 space-y-4">
              <div className="glass-card p-5 rounded-2xl space-y-4 shadow-lg">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h2 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <span>📄</span> Contract & Message Inputs
                  </h2>
                </div>

                {/* Financial Controls */}
                <div className="grid grid-cols-3 gap-2.5 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                  <div>
                    <label className="text-[11px] font-medium text-slate-400">Daily Rate</label>
                    <div className="flex items-center mt-1">
                      <span className="bg-slate-800 text-slate-400 text-xs px-2 py-1.5 rounded-l-md border border-r-0 border-slate-700">{currency}</span>
                      <input
                        type="number"
                        value={dailyRate}
                        onChange={(e) => setDailyRate(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 py-1 px-2 text-xs rounded-r-md text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-[11px] font-medium text-slate-400">Currency</label>
                    <select
                      value={currency}
                      onChange={(e) => handleCurrencyChange(e.target.value)}
                      className="w-full mt-1 bg-slate-900 border border-slate-700 py-1.5 px-2 text-xs rounded-md text-white focus:outline-none focus:border-indigo-500"
                    >
                      <option value="$">USD ($)</option>
                      <option value="Rs">PKR (Rs)</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[11px] font-medium text-slate-400">Email Tone</label>
                    <select
                      value={tone}
                      onChange={(e) => setTone(e.target.value)}
                      className="w-full mt-1 bg-slate-900 border border-slate-700 py-1.5 px-2 text-xs rounded-md text-white focus:outline-none focus:border-indigo-500"
                    >
                      <option value="diplomatic">Diplomatic</option>
                      <option value="firm">Firm / Strict</option>
                      <option value="flexible">Flexible</option>
                    </select>
                  </div>
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                      <span>📜</span> Signed Statement of Work (SOW):
                    </label>
                    <span className="text-[10px] text-slate-500">Baseline Agreement</span>
                  </div>
                  <textarea
                    rows="6"
                    value={sow}
                    onChange={(e) => setSow(e.target.value)}
                    className="w-full bg-slate-950/80 border border-slate-700/80 p-3 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-indigo-500 mono leading-relaxed"
                    placeholder="Paste signed contract, deliverables, and out-of-scope clauses here..."
                  />
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                      <span>📩</span> Client Email / Feature Request:
                    </label>
                    <span className="text-[10px] text-slate-500">Incoming Message</span>
                  </div>
                  <textarea
                    rows="6"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full bg-slate-950/80 border border-slate-700/80 p-3 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-indigo-500 mono leading-relaxed"
                    placeholder="Paste client email, Slack message, or Change Request..."
                  />
                </div>

                <button
                  onClick={runAudit}
                  disabled={loading}
                  className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 font-bold rounded-xl text-white shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-sm disabled:opacity-50"
                >
                  {loading ? (
                    <>
                      <span className="inline-block animate-spin">⏳</span>
                      <span>Auditing Contract & Estimating Drift...</span>
                    </>
                  ) : (
                    <>
                      <span>🔍</span>
                      <span>Run AI Scope Audit & Draft CR</span>
                    </>
                  )}
                </button>

                <button
                  onClick={loadDemoAudit}
                  disabled={loading}
                  className="w-full py-2 bg-slate-900/90 hover:bg-slate-800 text-slate-300 hover:text-indigo-300 font-semibold rounded-xl border border-slate-800 hover:border-indigo-500/40 transition-all flex items-center justify-center gap-2 text-xs"
                >
                  <span>⚡</span>
                  <span>Try Instant Sample Demo (No Backend Required)</span>
                </button>
              </div>
            </div>

            {/* Right Results Column (7 cols) */}
            <div className="lg:col-span-7 space-y-4">
              <div className="glass-card p-5 rounded-2xl space-y-4 shadow-lg min-h-[560px] flex flex-col">
                {/* Result Tabs & Header */}
                <div className="flex flex-wrap justify-between items-center pb-3 border-b border-slate-800 gap-3">
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => setActiveTab("breakdown")}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                        activeTab === "breakdown" ? "bg-indigo-600 text-white shadow" : "text-slate-400 hover:text-white bg-slate-900/60"
                      }`}
                    >
                      📊 Scope Breakdown
                    </button>
                    <button
                      onClick={() => setActiveTab("email")}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                        activeTab === "email" ? "bg-indigo-600 text-white shadow" : "text-slate-400 hover:text-white bg-slate-900/60"
                      }`}
                    >
                      ✉️ Negotiation Email
                    </button>
                    <button
                      onClick={() => setActiveTab("change_order")}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                        activeTab === "change_order" ? "bg-indigo-600 text-white shadow" : "text-slate-400 hover:text-white bg-slate-900/60"
                      }`}
                    >
                      📑 Formal Change Order
                    </button>
                  </div>

                  {analysis && (
                    <div className="flex items-center space-x-2">
                      {activeTab === "email" && (
                        <button
                          onClick={copyEmail}
                          className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all"
                        >
                          {copyToast ? <span>✅ Copied!</span> : <span>📋 Copy Email</span>}
                        </button>
                      )}
                      {activeTab === "change_order" && (
                        <button
                          onClick={downloadChangeOrder}
                          className="px-3 py-1.5 bg-emerald-800/60 hover:bg-emerald-700/80 text-xs font-semibold rounded-lg text-emerald-200 border border-emerald-600/50 flex items-center gap-1.5 transition-all"
                        >
                          <span>📥 Download (.md)</span>
                        </button>
                      )}
                    </div>
                  )}
                </div>

                {/* Analysis Content */}
                {analysis ? (
                  <div className="flex-1 space-y-4 text-xs">
                    {/* Summary Metric Strip */}
                    <div className={`p-4 rounded-xl border flex flex-wrap justify-between items-center gap-4 ${
                      analysis.has_scope_creep
                        ? "bg-rose-950/30 border-rose-500/40 text-rose-300"
                        : "bg-emerald-950/30 border-emerald-500/40 text-emerald-300"
                    }`}>
                      <div className="flex items-center gap-3">
                        <span className="text-2xl">{analysis.has_scope_creep ? "🚨" : "✅"}</span>
                        <div>
                          <div className="font-bold text-sm">
                            {analysis.has_scope_creep ? "Scope Creep Detected" : "100% In-Scope (No Creep)"}
                          </div>
                          <div className="text-[11px] text-slate-400">
                            {analysis.has_scope_creep
                              ? "Additional capabilities exceed the baseline contract."
                              : "All requested items conform to the signed deliverables."}
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-4 text-right">
                        <div>
                          <div className="text-[10px] uppercase tracking-wider text-slate-400">Schedule Drift</div>
                          <div className="font-bold text-base text-white">+{analysis.total_drift_days} Days</div>
                        </div>
                        <div className="border-l border-slate-700/60 pl-4">
                          <div className="text-[10px] uppercase tracking-wider text-slate-400">Estimated Cost</div>
                          <div className="font-bold text-base text-emerald-400">
                            +{analysis.currency_symbol || currency}{analysis.total_extra_cost.toLocaleString()}
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Tab 1: Scope Breakdown */}
                    {activeTab === "breakdown" && (
                      <div className="space-y-3">
                        <div className="overflow-x-auto rounded-xl border border-slate-800">
                          <table className="w-full text-left">
                            <thead className="bg-slate-900/90 text-slate-400 text-[11px] uppercase tracking-wider border-b border-slate-800">
                              <tr>
                                <th className="p-3">Feature Capability</th>
                                <th className="p-3">Scope Status</th>
                                <th className="p-3">Dev Days</th>
                                <th className="p-3 text-right">Cost Impact</th>
                                <th className="p-3 text-center">Clause & Details</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/60 bg-slate-950/40">
                              {analysis.features && analysis.features.map((f, i) => (
                                <React.Fragment key={i}>
                                  <tr className="hover:bg-slate-900/40 transition-colors">
                                    <td className="p-3 font-medium text-slate-200">
                                      <div className="font-semibold text-white">{f.feature_name}</div>
                                      <div className="text-[11px] text-slate-400 truncate max-w-xs">{f.reasoning}</div>
                                    </td>
                                    <td className="p-3 whitespace-nowrap">{getStatusBadge(f.status)}</td>
                                    <td className="p-3 font-semibold text-slate-300">
                                      {f.estimated_dev_days > 0 ? `+${f.estimated_dev_days}d` : "0d"}
                                    </td>
                                    <td className="p-3 text-right font-bold text-emerald-400 whitespace-nowrap">
                                      {f.estimated_cost > 0 ? `+${analysis.currency_symbol || currency}${f.estimated_cost.toLocaleString()}` : `${analysis.currency_symbol || currency}0`}
                                    </td>
                                    <td className="p-3 text-center">
                                      <button
                                        onClick={() => setExpandedRow(expandedRow === i ? null : i)}
                                        className="text-[11px] text-indigo-400 hover:text-indigo-300 underline font-medium"
                                      >
                                        {expandedRow === i ? "Hide" : "View Clause"}
                                      </button>
                                    </td>
                                  </tr>
                                  {expandedRow === i && (
                                    <tr className="bg-slate-900/70 border-b border-indigo-900/40">
                                      <td colSpan="5" className="p-4 space-y-2 text-xs">
                                        <div className="flex items-start gap-2">
                                          <span className="text-indigo-400 font-bold">Contract Clause Citation:</span>
                                          <span className="text-slate-300 italic bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                            {f.sow_clause_citation || "Not specified in contract"}
                                          </span>
                                        </div>
                                        <div>
                                          <span className="text-indigo-400 font-bold">Detailed Reasoning:</span>
                                          <p className="text-slate-300 mt-0.5 leading-relaxed">{f.reasoning}</p>
                                        </div>
                                      </td>
                                    </tr>
                                  )}
                                </React.Fragment>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {/* Tab 2: Client Negotiation Email Draft */}
                    {activeTab === "email" && (
                      <div className="space-y-3">
                        <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-3">
                          <div>
                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Subject Line:</span>
                            <div className="text-sm font-bold text-white mt-0.5">{analysis.client_response_subject}</div>
                          </div>
                          <hr className="border-slate-800" />
                          <div>
                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Message Body:</span>
                            <pre className="whitespace-pre-wrap font-sans text-xs text-slate-300 mt-2 leading-relaxed bg-slate-900/60 p-4 rounded-lg border border-slate-800/80">
                              {analysis.client_response_body}
                            </pre>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* Tab 3: Formal Change Order Document */}
                    {activeTab === "change_order" && (
                      <div className="space-y-3">
                        <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                          <pre className="whitespace-pre-wrap font-sans text-xs text-slate-300 leading-relaxed bg-slate-900/60 p-4 rounded-lg border border-slate-800/80 mono">
                            {analysis.change_order_markdown || "Generating change order..."}
                          </pre>
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="flex-1 flex flex-col items-center justify-center text-center p-8 space-y-3">
                    <div className="h-16 w-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-2xl text-slate-500 shadow-inner">
                      📋
                    </div>
                    <div className="text-sm font-semibold text-slate-300">No Audit Run Yet</div>
                    <p className="text-xs text-slate-500 max-w-sm">
                      Paste your signed SOW and incoming client email request on the left, then click <strong className="text-slate-300">Run AI Scope Audit</strong>.
                    </p>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Settings Modal */}
          {showSettings && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-card max-w-md w-full p-6 rounded-2xl border border-slate-700 shadow-2xl space-y-4 animate-fadeIn">
                <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <span>⚙️</span> Backend API Configuration
                  </h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white text-lg leading-none p-1">
                    ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <p className="text-slate-300 leading-relaxed">
                    When hosted on <strong>GitHub Pages</strong>, you can connect to a live backend deployed on a free cloud service (like Render, Railway, or Fly.io), or a local backend.
                  </p>

                  <div>
                    <label className="font-semibold text-slate-300 block mb-1">Backend Server URL:</label>
                    <input
                      type="text"
                      value={tempUrl}
                      onChange={(e) => {
                        setTempUrl(e.target.value);
                        setConnectionStatus(null);
                      }}
                      placeholder="e.g. https://scope-sentinel.onrender.com"
                      className="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-lg text-white font-mono text-xs focus:outline-none focus:border-indigo-500"
                    />
                    <p className="text-[11px] text-slate-500 mt-1">
                      Leave blank to auto-detect (<code className="text-slate-400">/api/analyze</code> or <code className="text-slate-400">http://localhost:8000</code>).
                    </p>
                  </div>

                  <div className="flex items-center justify-between pt-1">
                    <button
                      onClick={() => testConnection(tempUrl)}
                      disabled={connectionStatus === "testing"}
                      className="text-[11px] px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 transition-colors"
                    >
                      {connectionStatus === "testing" ? "Testing..." : "Test Connection"}
                    </button>
                    {connectionStatus === "ok" && (
                      <span className="text-emerald-400 font-semibold text-xs flex items-center gap-1">
                        ✓ Server Online
                      </span>
                    )}
                    {connectionStatus === "fail" && (
                      <span className="text-rose-400 font-semibold text-xs flex items-center gap-1">
                        ✗ Connection Failed
                      </span>
                    )}
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                  <button
                    onClick={() => {
                      setTempUrl("");
                      setBackendUrl("");
                      localStorage.removeItem("sentinel_backend_url");
                      setShowSettings(false);
                    }}
                    className="px-3 py-1.5 text-xs text-slate-400 hover:text-white"
                  >
                    Reset to Default
                  </button>
                  <button
                    onClick={() => {
                      const cleaned = tempUrl.trim();
                      setBackendUrl(cleaned);
                      if (cleaned) {
                        localStorage.setItem("sentinel_backend_url", cleaned);
                      } else {
                        localStorage.removeItem("sentinel_backend_url");
                      }
                      setShowSettings(false);
                    }}
                    className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-lg shadow transition-all"
                  >
                    Save & Apply
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
